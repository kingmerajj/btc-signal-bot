name: BTC Daily Signal Bot

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  run-signal:
    runs-on: ubuntu-latest
    permissions:
      contents: write # این خط اجازه کامیت کردن رو به ربات می‌ده
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal bot
        env:
          EMAIL_SENDER:   ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python signal_bot.py

      - name: Commit signal memory
        run: |
          git config --global user.name 'Signal Bot'
          git config --global user.email 'bot@example.com'
          git add last_signal.txt
          git commit -m "Update last signal memory" || echo "No changes to commit"
          git push
